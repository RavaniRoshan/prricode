name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an older run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install bubblewrap
        # The sandbox's real-backend tests **skip** when the backend is not
        # usable, so without this the suite would pass without ever
        # exercising the sandbox's confinement — on a runner that can.
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Report whether the sandbox backend can run here
        # The tests skip when the host refuses an unprivileged user namespace.
        # Say so in the log, so a green run is never mistaken for a run that
        # exercised the sandbox.
        run: |
          if unshare -Ur true 2>/dev/null; then
            echo "unprivileged user namespaces are available: the sandbox's real-backend tests will run"
          else
            echo "::warning::unprivileged user namespaces are not available on this runner: the sandbox's real-backend tests will skip, so this run does not exercise the sandbox's confinement"
          fi
      - name: Test
        run: bun run test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: The executable starts and prints its version
        run: |
          ./dist/prricode --version
          test -x ./dist/prricode
