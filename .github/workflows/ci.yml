name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an older run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: The executable starts and prints its version
        run: |
          ./dist/agent --version
          test -x ./dist/agent
