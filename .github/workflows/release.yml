name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        if: ${{ !matrix.cross }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          rustup target add ${{ matrix.target }}
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cross-compile with cross (linux aarch64)
        if: ${{ matrix.cross }}
        run: |
          cargo install cross --locked
          cross build --release --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          strip prricode || true
          tar czf ../../../prricode-${{ matrix.target }}.tar.gz prricode

      - name: Package (windows)
        if: ${{ matrix.archive == 'zip' }}
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../prricode-${{ matrix.target }}.zip prricode.exe

      - name: Checksums
        shell: bash
        run: |
          FILE="prricode-${{ matrix.target }}.${{ matrix.archive }}"
          # macOS runners have shasum, not sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$FILE" | tee "prricode-${{ matrix.target }}.sha256"
          else
            shasum -a 256 "$FILE" | tee "prricode-${{ matrix.target }}.sha256"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: prricode-${{ matrix.target }}
          path: |
            prricode-${{ matrix.target }}.tar.gz
            prricode-${{ matrix.target }}.zip
            prricode-${{ matrix.target }}.sha256
          if-no-files-found: error

  # Both macOS targets come out of one job on one arm64 runner: the pool is
  # the bottleneck and two queued jobs double both the wait and the macOS
  # minutes burned. Cross-compiling x86_64 from arm64 is free (same SDK).
  macos:
    name: macos (x86_64 + aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          rustup target add x86_64-apple-darwin
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build both targets
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target"
          done
      - name: Package
        shell: bash
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            (cd "target/$target/release" && strip prricode || true)
            tar czf "prricode-$target.tar.gz" -C "target/$target/release" prricode
          done
          ls -1 prricode-*.tar.gz
      - name: Checksums
        shell: bash
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            shasum -a 256 "prricode-$target.tar.gz" | tee "prricode-$target.sha256"
          done
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            prricode-aarch64-apple-darwin.tar.gz
            prricode-x86_64-apple-darwin.tar.gz
            prricode-aarch64-apple-darwin.sha256
            prricode-x86_64-apple-darwin.sha256
          if-no-files-found: error


  release:
    name: publish release
    needs: [build, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combined checksums
        run: |
          cd artifacts
          sha256sum prricode-* | grep -v '\.sha256$' > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/prricode-*
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: false
