name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        if: ${{ !matrix.cross }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          rustup target add ${{ matrix.target }}
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cross-compile with cross (linux aarch64)
        if: ${{ matrix.cross }}
        run: |
          cargo install cross --locked
          cross build --release --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          strip prricode || true
          tar czf ../../../prricode-${{ matrix.target }}.tar.gz prricode

      - name: Package (windows)
        if: ${{ matrix.archive == 'zip' }}
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../prricode-${{ matrix.target }}.zip prricode.exe

      - name: Checksums
        shell: bash
        run: |
          sha256sum prricode-${{ matrix.target }}.* | tee prricode-${{ matrix.target }}.sha256

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: prricode-${{ matrix.target }}
          path: |
            prricode-${{ matrix.target }}.tar.gz
            prricode-${{ matrix.target }}.zip
            prricode-${{ matrix.target }}.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combined checksums
        run: |
          cd artifacts
          sha256sum prricode-* | grep -v '\.sha256$' > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/prricode-*
          fail_on_unmatched_files: true
          generate_release_notes: false
