name: Feature request
description: Suggest a capability, a stage, or a change to how something works
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today? Skip the solution for now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: The shape of the thing that would solve it, as concretely as you can.
    validations:
      required: true
  - type: dropdown
    id: quadrant
    attributes:
      label: Which part of the product
      options:
        - Agent loop / tools
        - Providers
        - TUI
        - Product Builder pipeline
        - Verification
        - Ship / deploy / operate
        - Protocol surface
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you tried to get this done, and why they fell short.
