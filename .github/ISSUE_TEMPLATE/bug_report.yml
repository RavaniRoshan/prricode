name: Bug report
description: Something broke, produced the wrong result, or reported a misleading status
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what actually happened.
      placeholder: |
        $ prricode exec "summarize this repo" --provider ollama --model qwen2.5-coder:3b
        expected: a summary
        actual: Error: provider 'ollama' http 404: model not found
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git rev-parse HEAD`, or the release tag.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where it happened
      options:
        - TUI
        - CLI
        - JSON-RPC server (serve)
        - Product Builder pipeline
        - Computer use
        - Build/install
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - echo (offline)
        - ollama (local)
        - ollama-cloud
        - openrouter
        - kilo
        - openai
        - custom
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem. Include any files or workspace setup.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste anything relevant. Redact API keys — they are never needed in a report.
      render: shell
